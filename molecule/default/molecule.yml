---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "${MOLECULE_IMAGE:-ubuntu:26.04}"
    dockerfile: Dockerfile.j2
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: false
    tmpfs:
      - /run
      - /run/lock
      - /tmp
provisioner:
  name: ansible
  log: true
  env:
    # The bundled Docker driver reads invocation.module_args.dest when building.
    ANSIBLE_INJECT_INVOCATION: 'true'
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  inventory:
    host_vars:
      instance:
        ansible_user: root
